name: Cleanup Orphaned Packages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to clean up (removes files not in database)'
        required: true
        type: choice
        options:
          - edge
          - stable
      dry_run:
        description: 'Dry run (list files but do not delete)'
        required: true
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    environment: publish
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pacman -Sy --noconfirm rclone pacman

      - name: Cleanup orphaned packages
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          CHANNEL="${{ inputs.channel }}"
          DRY_RUN="${{ inputs.dry_run }}"
          
          echo "=== Cleanup Orphaned Packages ==="
          echo "Channel: $CHANNEL"
          echo "Dry run: $DRY_RUN"
          echo ""
          
          # Download database
          echo "==> Downloading database..."
          mkdir -p /tmp/db
          if ! rclone copy r2:hoopoo-pkgs/$CHANNEL/x86_64/ /tmp/db/ \
               --include "hoopoo.db.tar.zst" \
               --s3-no-check-bucket 2>/dev/null; then
            echo "ERROR: Could not download database"
            exit 1
          fi
          
          if [[ ! -f /tmp/db/hoopoo.db.tar.zst ]]; then
            echo "ERROR: Database not found"
            exit 1
          fi
          
          # Extract all filenames from database
          echo "==> Extracting filenames from database..."
          declare -A db_files
          while IFS= read -r filename; do
            [[ -n "$filename" ]] || continue
            db_files["$filename"]=1
            db_files["$filename.sig"]=1
            echo "  Referenced: $filename"
          done < <(tar -xOf /tmp/db/hoopoo.db.tar.zst --wildcards '*/desc' 2>/dev/null | \
            awk '$0 == "%FILENAME%" { getline; if ($0 != "") print $0 }')
          
          echo ""
          echo "Database references ${#db_files[@]} files (packages + signatures)"
          
          # List all package files in R2
          echo ""
          echo "==> Listing all package files in R2..."
          mapfile -t r2_files < <(rclone lsf r2:hoopoo-pkgs/$CHANNEL/x86_64/ \
            --include "*.pkg.tar.zst*" \
            --exclude "*.db*" --exclude "*.files*" \
            --s3-no-check-bucket 2>/dev/null)
          
          echo "Found ${#r2_files[@]} files in R2"
          
          # Find orphaned files
          echo ""
          echo "==> Identifying orphaned files..."
          orphans=()
          for file in "${r2_files[@]}"; do
            if [[ -z "${db_files[$file]}" ]]; then
              orphans+=("$file")
              echo "  Orphaned: $file"
            fi
          done
          
          if [[ ${#orphans[@]} -eq 0 ]]; then
            echo ""
            echo "✓ No orphaned files found"
            exit 0
          fi
          
          echo ""
          echo "Found ${#orphans[@]} orphaned file(s)"
          
          # Delete orphaned files
          if [[ "$DRY_RUN" == "true" ]]; then
            echo ""
            echo "==> DRY RUN: Would delete ${#orphans[@]} file(s)"
            echo "Run again with dry_run=false to actually delete"
          else
            echo ""
            echo "==> Deleting orphaned files from R2..."
            deleted=0
            for file in "${orphans[@]}"; do
              if rclone deletefile r2:hoopoo-pkgs/$CHANNEL/x86_64/$file --s3-no-check-bucket 2>/dev/null; then
                echo "  Deleted: $file"
                deleted=$((deleted + 1))
              else
                echo "  Failed to delete: $file"
              fi
            done
            echo ""
            echo "✓ Deleted $deleted orphaned file(s)"
          fi
