name: Migrate Packages to R2

on:
  workflow_dispatch:
    inputs:
      channels:
        description: 'Channels to migrate (comma-separated: edge,stable)'
        required: true
        default: 'edge,stable'

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: r2-publish
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone curl jq

      - name: Migrate packages to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          IFS=',' read -ra CHANNELS <<< "${{ github.event.inputs.channels }}"
          
          for channel in "${CHANNELS[@]}"; do
            channel=$(echo "$channel" | xargs) # trim whitespace
            echo "========================================="
            echo "Migrating channel: $channel"
            echo "========================================="
            
            # Get release info
            if ! gh release view "$channel" --repo "${{ github.repository }}" --json assets > /tmp/release-${channel}.json 2>/dev/null; then
              echo "Release '$channel' not found, skipping"
              continue
            fi
            
            # Extract package and signature URLs
            jq -r '.assets[] | select(.name | endswith(".pkg.tar.zst") or endswith(".pkg.tar.zst.sig") or endswith(".db.tar.gz") or endswith(".db") or endswith(".files.tar.gz") or endswith(".files")) | "\(.name)|\(.url)"' \
              /tmp/release-${channel}.json > /tmp/download-${channel}.txt
            
            total=$(wc -l < /tmp/download-${channel}.txt)
            echo "Found $total files to migrate"
            
            if (( total == 0 )); then
              echo "No files to migrate for $channel"
              continue
            fi
            
            # Download packages
            mkdir -p /tmp/migrate-${channel}
            cd /tmp/migrate-${channel}
            
            count=0
            while IFS='|' read -r name url; do
              count=$((count + 1))
              echo "[$count/$total] Downloading $name..."
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$url" -o "$name"
            done < /tmp/download-${channel}.txt
            
            echo ""
            echo "Downloaded packages:"
            ls -lh | head -20
            if (( total > 20 )); then
              echo "... and $((total - 20)) more files"
            fi
            
            echo ""
            echo "Uploading to R2: hoopoo-pkgs/$channel/x86_64/"
            
            # Upload to R2
            rclone copy . "r2:hoopoo-pkgs/$channel/x86_64/" \
              --progress \
              --transfers 16 \
              --s3-no-check-bucket \
              --s3-upload-concurrency 8 \
              --s3-chunk-size 64M
            
            echo ""
            echo "✓ Migration complete for $channel"
            echo "  Files uploaded: $total"
            echo "  Destination: pkgs.hoopoo.net/$channel/x86_64/"
            echo ""
          done
          
          echo "========================================="
          echo "All migrations complete!"
          echo "========================================="

      - name: Verify uploads
        run: |
          IFS=',' read -ra CHANNELS <<< "${{ github.event.inputs.channels }}"
          
          echo "Verifying uploaded files..."
          for channel in "${CHANNELS[@]}"; do
            channel=$(echo "$channel" | xargs)
            echo ""
            echo "Checking $channel database..."
            if curl -fsSL --retry 3 "https://pkgs.hoopoo.net/$channel/x86_64/hoopoo.db" > /dev/null 2>&1; then
              echo "✓ pkgs.hoopoo.net/$channel/x86_64/hoopoo.db is accessible"
            else
              echo "⚠ pkgs.hoopoo.net/$channel/x86_64/hoopoo.db not yet accessible (may take a moment)"
            fi
          done
