name: Copy Packages Between Branches

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of packages to copy (e.g. linux-ptl nvidia-580xx-utils)'
        required: true
      from:
        description: 'Source branch/release'
        required: true
        default: 'edge'
        type: choice
        options:
          - edge
          - stable
      to:
        description: 'Destination branch/release'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - edge
  workflow_call:
    inputs:
      packages:
        description: 'Space-separated list of packages to copy'
        required: true
        type: string
      from:
        description: 'Source release tag'
        required: false
        default: 'edge'
        type: string
      to:
        description: 'Destination release tag'
        required: false
        default: 'stable'
        type: string

jobs:
  copy:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup tools
        run: pacman -Sy --noconfirm pacman github-cli python curl

      - name: Copy packages
        run: |
          python3 bin/pkg-utils.py \
            --packages "${{ inputs.packages }}" \
            --from "${{ inputs.from }}" \
            --to "${{ inputs.to }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
