name: Copy Packages Between Channels

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of package base names to copy (e.g. voxtype linux-ptl). Automatically includes split packages.'
        required: true
      from:
        description: 'Source channel'
        required: true
        default: 'edge'
        type: choice
        options:
          - edge
          - stable
      to:
        description: 'Destination channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - edge

jobs:
  copy:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pacman -Sy --noconfirm rclone pacman gnupg

      - name: Import Hoopoo GPG key
        run: |
          # Import the public key for verification
          curl -sL https://pkgs.hoopoo.net/stable/x86_64/hoopoo-keyring-1.0.0-4-any.pkg.tar.zst -o /tmp/hoopoo-keyring.pkg.tar.zst
          pacman -U --noconfirm /tmp/hoopoo-keyring.pkg.tar.zst || true
          pacman-key --init
          pacman-key --populate hoopoo || true
          
          # Also import directly from keyserver as backup
          gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 070030E5D914817BA797F66AAF1C8F036A5E73FD || \
          gpg --keyserver hkps://keys.openpgp.org --recv-keys 070030E5D914817BA797F66AAF1C8F036A5E73FD || true

      - name: Copy packages via R2
        run: |
          bash bin/r2-copy-packages.sh \
            --packages "${{ inputs.packages }}" \
            --from "${{ inputs.from }}" \
            --to "${{ inputs.to }}"
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
