name: Copy Packages Between Channels (R2)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of packages to copy (e.g. linux-ptl nvidia-580xx-utils)'
        required: true
      from:
        description: 'Source channel'
        required: true
        default: 'edge'
        type: choice
        options:
          - edge
          - stable
      to:
        description: 'Destination channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - edge

jobs:
  copy:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pacman -Sy --noconfirm rclone pacman

      - name: Copy packages via R2
        run: |
          bash bin/r2-copy-packages.sh \
            --packages "${{ inputs.packages }}" \
            --from "${{ inputs.from }}" \
            --to "${{ inputs.to }}"
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
