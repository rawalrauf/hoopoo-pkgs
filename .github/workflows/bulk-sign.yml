name: Bulk Sign Packages (One-Time)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to sign packages in'
        required: true
        type: choice
        options:
          - stable
          - edge
      confirm:
        description: 'Type "SIGN" to confirm bulk signing'
        required: true

jobs:
  bulk-sign:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    environment: r2-publish
    permissions:
      contents: read

    steps:
      - name: Confirm action
        run: |
          if [[ "${{ inputs.confirm }}" != "SIGN" ]]; then
            echo "::error::Confirmation required. Type 'SIGN' to proceed."
            exit 1
          fi
          echo "::warning::Bulk signing ${{ inputs.channel }} channel"

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pacman -Sy --noconfirm rclone gnupg coreutils

      - name: Bulk sign packages
        run: |
          bash bin/bulk-sign-packages.sh --channel "${{ inputs.channel }}"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
