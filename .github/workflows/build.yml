name: Publish

on:
  push:
    branches: [edge]
    paths:
      - 'pkgbuilds/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of packages to build (empty = all)'
        required: false

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup build environment
        run: |
          # Enable multilib
          if ! grep -q '^\[multilib\]' /etc/pacman.conf; then
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          else
            sed -i '/^\[multilib\]/,/^$/{/^#/s/^#//}' /etc/pacman.conf
          fi
          pacman -Sy --noconfirm base-devel git go pacman neovim nodejs npm python gnupg github-cli

          useradd -m builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder "$GITHUB_WORKSPACE"

          # Import Hoopoo signing key for root
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye 2>/dev/null || true
          KEYGRIP=$(gpg --with-keygrip --list-secret-keys Hoopoo 2>/dev/null | grep Keygrip | head -1 | awk '{print $3}')
          if [[ -n $KEYGRIP ]]; then
            /usr/lib/gnupg/gpg-preset-passphrase --preset "$KEYGRIP" <<< "$GPG_PASSPHRASE" 2>/dev/null || true
          fi

          # Install hoopoo-keyring so builds can verify GPG-signed sources
          keyring_url=$(curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/stable" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | python3 -c "import json,sys; assets=[a['browser_download_url'] for a in json.load(sys.stdin).get('assets',[]) if 'hoopoo-keyring' in a['name'] and a['name'].endswith('.pkg.tar.zst')]; print(assets[0] if assets else '')")
          if [[ -n $keyring_url ]]; then
            curl -sL "$keyring_url" -o /tmp/hoopoo-keyring.pkg.tar.zst
            pacman -U --noconfirm /tmp/hoopoo-keyring.pkg.tar.zst || true
            pacman-key --populate hoopoo || true
          fi

          # Import GPG keys from per-package .hoopoo/package.json
          for f in pkgbuilds/*/.hoopoo/package.json; do
            [[ -f $f ]] || continue
            python3 -c "import json,sys; [print(k) for k in json.load(open(sys.argv[1])).get('gpg_keys',[])]" "$f" 2>/dev/null
          done | sort -u | while read key; do
            sudo -u builder gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys "$key" 2>/dev/null || \
            sudo -u builder gpg --keyserver hkps://keys.openpgp.org --recv-keys "$key" || true
            sleep 1
          done
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Determine packages to build
        id: packages
        run: |
          if [[ -n "${{ github.event.inputs.packages }}" ]]; then
            echo "pkgs=${{ github.event.inputs.packages }}" >> $GITHUB_OUTPUT
          else
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^pkgbuilds/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if [[ -z $changed ]]; then
              changed=$(ls pkgbuilds/ | tr '\n' ' ')
            fi
            echo "pkgs=$changed" >> $GITHUB_OUTPUT
          fi

      - name: Install hoopoo packages as dependencies
        run: |
          TAG="stable"
          echo "Fetching release: $TAG"
          curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/release.json 2>/dev/null || true
          echo "Release JSON size: $(wc -c < /tmp/release.json 2>/dev/null || echo 0) bytes"

          needed_deps=""
          for pkg in ${{ steps.packages.outputs.pkgs }}; do
            pkgjson="pkgbuilds/$pkg/.hoopoo/package.json"
            [[ -f $pkgjson ]] || continue
            deps=$(python3 -c "import json,sys; print(' '.join(json.load(open(sys.argv[1])).get('hoopoo_deps',[])))" "$pkgjson" 2>/dev/null)
            [[ -n $deps ]] && needed_deps="$needed_deps $deps" && echo "  $pkg needs: $deps"
          done
          echo "All deps needed: $needed_deps"

          if [[ -n ${needed_deps// /} && -f /tmp/release.json ]]; then
            mkdir -p /tmp/hoopoo-deps
            for dep in $needed_deps; do
              [[ -z $dep ]] && continue
              echo "Fetching: $dep"
              url=$(python3 bin/find-dep-url.py /tmp/release.json "$dep" 2>/dev/null)
              echo "URL: $url"
              [[ -n $url ]] && curl -sL "$url" -o "/tmp/hoopoo-deps/${dep}.pkg.tar.zst" && echo "Downloaded $dep"
            done
            for pkg in /tmp/hoopoo-deps/*.pkg.tar.zst; do
              [[ -f $pkg ]] && pacman -U --noconfirm "$pkg" 2>/dev/null || true
            done
          else
            echo "No hoopoo deps needed"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch existing release assets
        run: |
          curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/edge" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/existing-release.json 2>/dev/null || echo '{}' > /tmp/existing-release.json
          python3 -c "
          import json, sys
          data = json.load(open('/tmp/existing-release.json'))
          assets = [a['name'] for a in data.get('assets', [])]
          print('\n'.join(assets))
          " > /tmp/existing-assets.txt
          echo "Existing assets:"
          cat /tmp/existing-assets.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages
        run: |
          mkdir -p output
          skipped=0
          built=0
          for pkg in ${{ steps.packages.outputs.pkgs }}; do
            [[ -d pkgbuilds/$pkg ]] || continue

            pkgver=$(bash -c "source pkgbuilds/$pkg/PKGBUILD 2>/dev/null && echo \${epoch:+\$epoch:}\$pkgver-\$pkgrel" 2>/dev/null)
            pkgname=$(bash -c "source pkgbuilds/$pkg/PKGBUILD 2>/dev/null && echo \$pkgname" 2>/dev/null)
            arch_arr=$(bash -c "source pkgbuilds/$pkg/PKGBUILD 2>/dev/null && echo \${arch[*]}" 2>/dev/null)

            if [[ $arch_arr == "any" ]]; then
              arch="any"
            else
              arch="x86_64"
            fi

            if [[ -n $pkgver && -n $pkgname && -n $arch ]]; then
              # Encode pkgver the same way pacman does for filenames:
              # colons -> dots, + -> .2B
              encoded_ver="${pkgver//:/.}"
              encoded_ver="${encoded_ver//+/.2B}"
              expected_file="${pkgname}-${encoded_ver}-${arch}.pkg.tar.zst"
              if grep -qF "$expected_file" /tmp/existing-assets.txt 2>/dev/null; then
                echo "=== Skipping $pkg ($expected_file already published) ==="
                skipped=$(( skipped + 1 ))
                continue
              fi
            fi

            echo "=== Building $pkg ==="

            extra_flags=""
            pkgjson="pkgbuilds/$pkg/.hoopoo/package.json"
            if [[ -f $pkgjson ]]; then
              nocheck=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('nocheck',''))" "$pkgjson" 2>/dev/null)
              [[ $nocheck == "true" ]] && extra_flags="--nocheck"
            fi

            cp -r pkgbuilds/$pkg /tmp/build-$pkg
            chown -R builder /tmp/build-$pkg
            cd /tmp/build-$pkg
            sudo -u builder makepkg -s --noconfirm --noprogressbar --needed $extra_flags 2>&1 || {
              echo "FAILED: $pkg" ; cd $GITHUB_WORKSPACE ; continue
            }
            cp *.pkg.tar.zst $GITHUB_WORKSPACE/output/ 2>/dev/null || true
            built=$(( built + 1 ))
            cd $GITHUB_WORKSPACE
          done

          echo "Built: $built, Skipped: $skipped"
          if (( built == 0 )); then
            echo "No packages needed rebuilding — all up to date."
            echo "nothing_built=true" >> $GITHUB_ENV
          fi
          ls -lh output/ 2>/dev/null || true

      - name: Sign packages
        if: env.nothing_built != 'true'
        run: |
          for pkg in output/*.pkg.tar.zst; do
            [[ -f $pkg ]] || continue
            echo "Signing $pkg"
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign "$pkg"
          done
          ls output/*.sig 2>/dev/null || echo "No signatures generated"
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify package signatures
        if: env.nothing_built != 'true'
        run: |
          ok=0; fail=0
          for sig in output/*.pkg.tar.zst.sig; do
            [[ -f $sig ]] || continue
            pkg="${sig%.sig}"
            if gpg --batch --verify "$sig" "$pkg" 2>/dev/null; then
              echo "OK: $(basename $pkg)"
              ok=$(( ok + 1 ))
            else
              echo "FAIL: $(basename $pkg)"
              fail=$(( fail + 1 ))
            fi
          done
          echo "Verified: $ok, Failed: $fail"
          (( fail == 0 ))

      - name: Determine release tag
        id: tag
        run: echo "name=edge" >> $GITHUB_OUTPUT

      - name: Generate pacman repo database
        if: env.nothing_built != 'true'
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          mkdir -p output

          curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/release.json 2>/dev/null || true

          python3 << 'EOF'
          import json, os

          def pkgbase(name):
            n = name.replace('.pkg.tar.zst', '')
            parts = n.rsplit('-', 3)
            return parts[0] if len(parts) == 4 else n

          new_bases = {pkgbase(f) for f in os.listdir('output') if f.endswith('.pkg.tar.zst')}

          try:
            release = json.load(open('/tmp/release.json'))
          except Exception:
            release = {}

          to_download = []
          to_remove = []
          seen = set(new_bases)

          for asset in release.get('assets', []):
            name = asset['name']
            if not name.endswith('.pkg.tar.zst') or '-debug-' in name:
              continue
            base = pkgbase(name)
            if base in seen:
              to_remove.append(name)
              print(f"Old version flagged: {name}")
              continue
            seen.add(base)
            to_download.append((name, asset['browser_download_url']))

          with open('/tmp/keep.txt', 'w') as f:
            f.write('\n'.join(f"{n}|{u}" for n, u in to_download) + '\n')
          with open('/tmp/remove.txt', 'w') as f:
            f.write('\n'.join(to_remove) + '\n')
          EOF

          while IFS='|' read -r name url; do
            [[ -z $name ]] && continue
            [[ -f output/$name ]] || curl -sL "$url" -o "output/$name"
          done < /tmp/keep.txt

          cd output
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if (( ${#pkgs[@]} > 0 )); then
            repo-add hoopoo.db.tar.gz "${pkgs[@]}"
            repo-files hoopoo.files.tar.gz "${pkgs[@]}"
          fi
          ls -lh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old pkg versions from release
        if: env.nothing_built != 'true'
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          while read -r name; do
            [[ -z $name ]] && continue
            echo "Deleting $name"
            gh release delete-asset "$TAG" "$name" \
              --repo "${{ github.repository }}" --yes 2>/dev/null || true
            gh release delete-asset "$TAG" "${name}.sig" \
              --repo "${{ github.repository }}" --yes 2>/dev/null || true
          done < /tmp/remove.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure release exists
        if: env.nothing_built != 'true'
        run: |
          gh release view "${{ steps.tag.outputs.name }}" \
            --repo "${{ github.repository }}" > /dev/null 2>&1 || \
          gh release create "${{ steps.tag.outputs.name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.tag.outputs.name }}" \
            --notes "Automated release" \
            --latest=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release
        if: env.nothing_built != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"

          for asset in hoopoo.db.tar.gz hoopoo.db hoopoo.files.tar.gz hoopoo.files; do
            gh release delete-asset "$TAG" "$asset" \
              --repo "${{ github.repository }}" --yes 2>/dev/null || true
          done

          cd output
          files_to_upload=""
          for f in *.pkg.tar.zst *.pkg.tar.zst.sig hoopoo.db.tar.gz hoopoo.db hoopoo.files.tar.gz hoopoo.files; do
            [[ -f $f ]] || continue
            # Delete existing asset first to avoid 422 conflict, ignore 404
            gh release delete-asset "$TAG" "$f" \
              --repo "${{ github.repository }}" --yes 2>/dev/null || true
            files_to_upload="$files_to_upload $f"
          done

          [[ -n ${files_to_upload// /} ]] && gh release upload "$TAG" $files_to_upload \
            --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
