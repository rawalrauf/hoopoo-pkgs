name: Publish

on:
  push:
    branches: [stable, edge]
    paths:
      - 'pkgbuilds/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of packages to build (empty = all)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup build environment
        run: |
          if ! grep -q '^\[multilib\]' /etc/pacman.conf; then
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          else
            sed -i '/^\[multilib\]/,/^$/{/^#/s/^#//}' /etc/pacman.conf
          fi
          grep -A2 '^\[multilib\]' /etc/pacman.conf || true
          pacman -Sy --noconfirm
          pacman -Sl multilib 2>/dev/null | wc -l && echo "multilib OK" || echo "multilib NOT available"
          pacman -S --noconfirm --needed base-devel git go pacman neovim nodejs npm python gnupg github-cli 2>&1 | tee /tmp/pacman.log || {
            echo "ERROR: pacman install failed"
            tail -30 /tmp/pacman.log
            exit 1
          }

          useradd -m builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder "$GITHUB_WORKSPACE"

          for f in pkgbuilds/*/.hoopoo/package.json; do
            [[ -f $f ]] || continue
            python3 -c "import json,sys; [print(k) for k in json.load(open(sys.argv[1])).get('gpg_keys',[])]" "$f" 2>/dev/null
          done | sort -u | while read key; do
            sudo -u builder gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys "$key" || true
          done

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder "$GITHUB_WORKSPACE"

          # Import GPG keys from all package.json files
          for f in pkgbuilds/*/.hoopoo/package.json; do
            [[ -f $f ]] || continue
            python3 -c "import json,sys; [print(k) for k in json.load(open(sys.argv[1])).get('gpg_keys',[])]" "$f" 2>/dev/null
          done | sort -u | while read key; do
            sudo -u builder gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys "$key" || true
          done

      - name: Determine packages to build
        id: packages
        run: |
          if [[ -n "${{ github.event.inputs.packages }}" ]]; then
            echo "pkgs=${{ github.event.inputs.packages }}" >> $GITHUB_OUTPUT
          else
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^pkgbuilds/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if [[ -z $changed ]]; then
              changed=$(ls pkgbuilds/ | tr '\n' ' ')
            fi
            echo "pkgs=$changed" >> $GITHUB_OUTPUT
          fi

      - name: Install hoopoo packages as dependencies
        run: |
          if [[ "${{ github.ref_name }}" == "stable" ]]; then TAG="stable"; else TAG="${{ github.ref_name }}"; fi
          curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/release.json 2>/dev/null || true

          # Collect hoopoo_deps for packages being built
          needed_deps=""
          for pkg in ${{ steps.packages.outputs.pkgs }}; do
            pkgjson="pkgbuilds/$pkg/.hoopoo/package.json"
            [[ -f $pkgjson ]] || continue
            deps=$(python3 -c "import json,sys; print(' '.join(json.load(open(sys.argv[1])).get('hoopoo_deps',[])))" "$pkgjson" 2>/dev/null)
            needed_deps="$needed_deps $deps"
          done

          if [[ -n $needed_deps && -f /tmp/release.json ]]; then
            mkdir -p /tmp/hoopoo-deps
            for dep in $needed_deps; do
              echo "Looking for dep: $dep"
              url=$(python3 bin/find-dep-url.py /tmp/release.json "$dep" 2>/dev/null)
              echo "URL: $url"
              [[ -n $url ]] && curl -sL "$url" -o "/tmp/hoopoo-deps/${dep}.pkg.tar.zst" && echo "Downloaded $dep"
            done
            for pkg in /tmp/hoopoo-deps/*.pkg.tar.zst; do
              [[ -f $pkg ]] && pacman -U --noconfirm "$pkg" 2>/dev/null || true
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages
        run: |
          mkdir -p output
          for pkg in ${{ steps.packages.outputs.pkgs }}; do
            [[ -d pkgbuilds/$pkg ]] || continue
            echo "=== Building $pkg ==="

            extra_flags=""
            pkgjson="pkgbuilds/$pkg/.hoopoo/package.json"
            if [[ -f $pkgjson ]]; then
              nocheck=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('nocheck',''))" "$pkgjson" 2>/dev/null)
              [[ $nocheck == "true" ]] && extra_flags="--nocheck"
            fi

            cp -r pkgbuilds/$pkg /tmp/build-$pkg
            chown -R builder /tmp/build-$pkg
            cd /tmp/build-$pkg
            sudo -u builder makepkg -s --noconfirm --noprogressbar --needed $extra_flags 2>&1 || {
              echo "FAILED: $pkg" ; cd $GITHUB_WORKSPACE ; continue
            }
            cp *.pkg.tar.zst $GITHUB_WORKSPACE/output/ 2>/dev/null || true
            cd $GITHUB_WORKSPACE
          done

          if ! ls output/*.pkg.tar.zst 1> /dev/null 2>&1; then
            echo "ERROR: No packages built successfully"
            exit 1
          fi
          ls -lh output/

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref_name }}" == "stable" ]]; then
            echo "name=stable" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate pacman repo database
        run: |
          cd output
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if (( ${#pkgs[@]} > 0 )); then
            repo-add hoopoo.db.tar.gz "${pkgs[@]}"
          fi
          ls -lh

      - name: Ensure release exists
        run: |
          gh release view "${{ steps.tag.outputs.name }}" \
            --repo "${{ github.repository }}" > /dev/null 2>&1 || \
          gh release create "${{ steps.tag.outputs.name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.tag.outputs.name }}" \
            --notes "Automated release" \
            --latest=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"

          for asset in hoopoo.db.tar.gz hoopoo.db hoopoo.files.tar.gz hoopoo.files; do
            gh release delete-asset "$TAG" "$asset" \
              --repo "${{ github.repository }}" --yes 2>/dev/null || true
          done

          cd output
          files_to_upload="*.pkg.tar.zst"
          [[ -f hoopoo.db.tar.gz ]] && files_to_upload+=" hoopoo.db.tar.gz"
          [[ -f hoopoo.db ]] && files_to_upload+=" hoopoo.db"
          [[ -f hoopoo.files.tar.gz ]] && files_to_upload+=" hoopoo.files.tar.gz"
          [[ -f hoopoo.files ]] && files_to_upload+=" hoopoo.files"

          gh release upload "$TAG" $files_to_upload \
            --repo "${{ github.repository }}" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
