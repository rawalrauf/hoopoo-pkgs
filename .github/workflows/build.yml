name: Publish

on:
  push:
    branches: [stable, edge]
    paths:
      - 'pkgbuilds/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of packages to build (empty = all)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    defaults:
      run:
        shell: bash -e {0}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup build environment
        run: |
          # Enable multilib
          if ! grep -q '^\[multilib\]' /etc/pacman.conf; then
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          else
            sed -i '/^\[multilib\]/,/^$/{/^#/s/^#//}' /etc/pacman.conf
          fi
          pacman -Sy --noconfirm base-devel git go pacman neovim nodejs npm python gnupg github-cli

          useradd -m builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder "$GITHUB_WORKSPACE"

          # TODO: Once hoopoo-keyring is published, install it here so builds can
          # verify GPG-signed sources against the Hoopoo key:
          #   pacman -U --noconfirm <hoopoo-keyring-url>
          #   pacman-key --populate hoopoo

          # Import GPG keys from per-package .hoopoo/package.json
          for f in pkgbuilds/*/.hoopoo/package.json; do
            [[ -f $f ]] || continue
            python3 -c "import json,sys; [print(k) for k in json.load(open(sys.argv[1])).get('gpg_keys',[])]" "$f" 2>/dev/null
          done | sort -u | while read key; do
            sudo -u builder gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys "$key" || true
          done

      - name: Determine packages to build
        id: packages
        run: |
          if [[ -n "${{ github.event.inputs.packages }}" ]]; then
            echo "pkgs=${{ github.event.inputs.packages }}" >> $GITHUB_OUTPUT
          else
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^pkgbuilds/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if [[ -z $changed ]]; then
              changed=$(ls pkgbuilds/ | tr '\n' ' ')
            fi
            echo "pkgs=$changed" >> $GITHUB_OUTPUT
          fi

      - name: Install hoopoo packages as dependencies
        run: |
          TAG="${{ github.ref_name }}"
          [[ "$TAG" == "stable" ]] || TAG="stable"
          echo "Fetching release: $TAG"
          curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/release.json 2>/dev/null || true
          echo "Release JSON size: $(wc -c < /tmp/release.json 2>/dev/null || echo 0) bytes"

          needed_deps=""
          for pkg in ${{ steps.packages.outputs.pkgs }}; do
            pkgjson="pkgbuilds/$pkg/.hoopoo/package.json"
            [[ -f $pkgjson ]] || continue
            deps=$(python3 -c "import json,sys; print(' '.join(json.load(open(sys.argv[1])).get('hoopoo_deps',[])))" "$pkgjson" 2>/dev/null)
            [[ -n $deps ]] && needed_deps="$needed_deps $deps" && echo "  $pkg needs: $deps"
          done
          echo "All deps needed: $needed_deps"

          if [[ -n ${needed_deps// /} && -f /tmp/release.json ]]; then
            mkdir -p /tmp/hoopoo-deps
            for dep in $needed_deps; do
              [[ -z $dep ]] && continue
              echo "Fetching: $dep"
              url=$(python3 bin/find-dep-url.py /tmp/release.json "$dep" 2>/dev/null)
              echo "URL: $url"
              [[ -n $url ]] && curl -sL "$url" -o "/tmp/hoopoo-deps/${dep}.pkg.tar.zst" && echo "Downloaded $dep"
            done
            for pkg in /tmp/hoopoo-deps/*.pkg.tar.zst; do
              [[ -f $pkg ]] && pacman -U --noconfirm "$pkg" 2>/dev/null || true
            done
          else
            echo "No hoopoo deps needed"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch existing release assets
        run: |
          TAG="${{ github.ref_name }}"
          [[ "$TAG" == "stable" ]] && RELEASE_TAG="stable" || RELEASE_TAG="$TAG"
          curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/existing-release.json 2>/dev/null || echo '{}' > /tmp/existing-release.json
          python3 -c "
          import json, sys
          data = json.load(open('/tmp/existing-release.json'))
          assets = [a['name'] for a in data.get('assets', [])]
          print('\n'.join(assets))
          " > /tmp/existing-assets.txt
          echo "Existing assets:"
          cat /tmp/existing-assets.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages
        run: |
          mkdir -p output
          skipped=0
          built=0
          for pkg in ${{ steps.packages.outputs.pkgs }}; do
            [[ -d pkgbuilds/$pkg ]] || continue

            pkgver=$(bash -c "source pkgbuilds/$pkg/PKGBUILD 2>/dev/null && echo \${epoch:+\$epoch:}\$pkgver-\$pkgrel" 2>/dev/null)
            pkgname=$(bash -c "source pkgbuilds/$pkg/PKGBUILD 2>/dev/null && echo \$pkgname" 2>/dev/null)
            arch_arr=$(bash -c "source pkgbuilds/$pkg/PKGBUILD 2>/dev/null && echo \${arch[*]}" 2>/dev/null)

            if [[ $arch_arr == "any" ]]; then
              arch="any"
            else
              arch="x86_64"
            fi

            if [[ -n $pkgver && -n $pkgname && -n $arch ]]; then
              expected_file="${pkgname}-${pkgver//:/.}-${arch}.pkg.tar.zst"
              if grep -qF "$expected_file" /tmp/existing-assets.txt 2>/dev/null; then
                echo "=== Skipping $pkg ($expected_file already published) ==="
                skipped=$(( skipped + 1 ))
                continue
              fi
            fi

            echo "=== Building $pkg ==="

            extra_flags=""
            pkgjson="pkgbuilds/$pkg/.hoopoo/package.json"
            if [[ -f $pkgjson ]]; then
              nocheck=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('nocheck',''))" "$pkgjson" 2>/dev/null)
              [[ $nocheck == "true" ]] && extra_flags="--nocheck"
            fi

            cp -r pkgbuilds/$pkg /tmp/build-$pkg
            chown -R builder /tmp/build-$pkg
            cd /tmp/build-$pkg
            sudo -u builder makepkg -s --noconfirm --noprogressbar --needed $extra_flags 2>&1 || {
              echo "FAILED: $pkg" ; cd $GITHUB_WORKSPACE ; continue
            }
            cp *.pkg.tar.zst $GITHUB_WORKSPACE/output/ 2>/dev/null || true
            built=$(( built + 1 ))
            cd $GITHUB_WORKSPACE
          done

          echo "Built: $built, Skipped: $skipped"
          if (( built == 0 )); then
            echo "No packages needed rebuilding — all up to date."
            echo "nothing_built=true" >> $GITHUB_ENV
          fi
          ls -lh output/ 2>/dev/null || true

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref_name }}" == "stable" ]]; then
            echo "name=stable" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate pacman repo database
        if: env.nothing_built != 'true'
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          mkdir -p output

          # Download existing packages from release to merge into db
          curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/release.json 2>/dev/null || true
          if [[ -f /tmp/release.json ]]; then
            grep -oP '"browser_download_url":\s*"\K[^"]+' /tmp/release.json | grep '\.pkg\.tar\.zst$' | grep -v debug | while read url; do
              name=$(basename "$url")
              [[ -f output/$name ]] || curl -sL "$url" -o "output/$name"
            done
          fi

          cd output
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if (( ${#pkgs[@]} > 0 )); then
            repo-add hoopoo.db.tar.gz "${pkgs[@]}"
          fi
          ls -lh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure release exists
        if: env.nothing_built != 'true'
        run: |
          gh release view "${{ steps.tag.outputs.name }}" \
            --repo "${{ github.repository }}" > /dev/null 2>&1 || \
          gh release create "${{ steps.tag.outputs.name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.tag.outputs.name }}" \
            --notes "Automated release" \
            --latest=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release
        if: env.nothing_built != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"

          for asset in hoopoo.db.tar.gz hoopoo.db hoopoo.files.tar.gz hoopoo.files; do
            gh release delete-asset "$TAG" "$asset" \
              --repo "${{ github.repository }}" --yes 2>/dev/null || true
          done

          cd output
          files_to_upload="*.pkg.tar.zst"
          [[ -f hoopoo.db.tar.gz ]] && files_to_upload+=" hoopoo.db.tar.gz"
          [[ -f hoopoo.db ]] && files_to_upload+=" hoopoo.db"
          [[ -f hoopoo.files.tar.gz ]] && files_to_upload+=" hoopoo.files.tar.gz"
          [[ -f hoopoo.files ]] && files_to_upload+=" hoopoo.files"

          gh release upload "$TAG" $files_to_upload \
            --repo "${{ github.repository }}" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
