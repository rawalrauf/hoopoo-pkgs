name: Publish

on:
  push:
    branches: [stable, edge]
    paths:
      - 'pkgbuilds/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of packages to build (empty = all)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup build environment
        run: |
          pacman -Sy --noconfirm base-devel git go pacman neovim nodejs npm python gnupg github-cli

          # Create non-root build user (makepkg refuses to run as root)
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # Allow builder to write to workspace
          chown -R builder "$GITHUB_WORKSPACE"

          # Import Spotify GPG key for signature verification
          sudo -u builder gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 5384CE82BA52C83A || true

          # Import Linux kernel GPG keys
          sudo -u builder gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 38DBBDC86092693E || true
          sudo -u builder gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys B8AC08600F108CDF || true

      - name: Determine packages to build
        id: packages
        run: |
          if [[ -n "${{ github.event.inputs.packages }}" ]]; then
            echo "pkgs=${{ github.event.inputs.packages }}" >> $GITHUB_OUTPUT
          else
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | \
              grep '^pkgbuilds/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if [[ -z $changed ]]; then
              changed=$(ls pkgbuilds/ | tr '\n' ' ')
            fi
            echo "pkgs=$changed" >> $GITHUB_OUTPUT
          fi

      - name: Install hoopoo packages as dependencies
        run: |
          TAG="${{ github.ref_name == 'stable' && 'stable' || github.ref_name }}"
          curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/release.json 2>/dev/null || true
          if [[ -f /tmp/release.json ]]; then
            mkdir -p /tmp/hoopoo-deps
            grep -oP '"browser_download_url":\s*"\K[^"]+' /tmp/release.json | grep '\.pkg\.tar\.zst$' | grep -v 'debug' | while read url; do
              name=$(basename "$url")
              curl -sL "$url" -o "/tmp/hoopoo-deps/$name"
            done
            if ls /tmp/hoopoo-deps/*.pkg.tar.zst &>/dev/null; then
              pacman -U --noconfirm /tmp/hoopoo-deps/*.pkg.tar.zst || true
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages
        run: |
          mkdir -p output
          for pkg in ${{ steps.packages.outputs.pkgs }}; do
            [[ -d pkgbuilds/$pkg ]] || continue
            echo "=== Building $pkg ==="
            cp -r pkgbuilds/$pkg /tmp/build-$pkg
            chown -R builder /tmp/build-$pkg
            cd /tmp/build-$pkg
            sudo -u builder makepkg -s --noconfirm --noprogressbar --needed 2>&1 || {
              echo "FAILED: $pkg" ; cd $GITHUB_WORKSPACE ; continue
            }
            cp *.pkg.tar.zst $GITHUB_WORKSPACE/output/ 2>/dev/null || true
            cd $GITHUB_WORKSPACE
          done

          if ! ls output/*.pkg.tar.zst 1> /dev/null 2>&1; then
            echo "ERROR: No packages built successfully"
            exit 1
          fi
          ls -lh output/

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref_name }}" == "stable" ]]; then
            echo "name=stable" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate pacman repo database
        run: |
          cd output
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if (( ${#pkgs[@]} > 0 )); then
            repo-add hoopoo.db.tar.gz "${pkgs[@]}"
          fi
          ls -lh

      - name: Ensure release exists
        run: |
          gh release view "${{ steps.tag.outputs.name }}" \
            --repo "${{ github.repository }}" > /dev/null 2>&1 || \
          gh release create "${{ steps.tag.outputs.name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.tag.outputs.name }}" \
            --notes "Automated release" \
            --latest=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"

          # Explicitly delete db/files assets first
          for asset in hoopoo.db.tar.gz hoopoo.db hoopoo.files.tar.gz hoopoo.files; do
            gh release delete-asset "$TAG" "$asset" \
              --repo "${{ github.repository }}" --yes 2>/dev/null || true
          done

          # Upload with clobber for any remaining pkg conflicts
          cd output
          files_to_upload="*.pkg.tar.zst"
          [[ -f hoopoo.db.tar.gz ]] && files_to_upload+=" hoopoo.db.tar.gz"
          [[ -f hoopoo.db ]] && files_to_upload+=" hoopoo.db"
          [[ -f hoopoo.files.tar.gz ]] && files_to_upload+=" hoopoo.files.tar.gz"
          [[ -f hoopoo.files ]] && files_to_upload+=" hoopoo.files"

          gh release upload "$TAG" $files_to_upload \
            --repo "${{ github.repository }}" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
