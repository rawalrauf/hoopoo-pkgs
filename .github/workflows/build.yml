name: Build and Publish Packages

on:
  push:
    branches: [main, edge]
    paths:
      - 'pkgbuilds/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of packages to build (leave empty for all changed)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          pacman -Sy --noconfirm base-devel git go

          # Create non-root build user (makepkg refuses to run as root)
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Determine packages to build
        id: packages
        run: |
          if [[ -n "${{ github.event.inputs.packages }}" ]]; then
            echo "pkgs=${{ github.event.inputs.packages }}" >> $GITHUB_OUTPUT
          else
            changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | \
              grep '^pkgbuilds/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "pkgs=$changed" >> $GITHUB_OUTPUT
          fi

      - name: Build packages
        run: |
          mkdir -p output
          for pkg in ${{ steps.packages.outputs.pkgs }}; do
            [[ -d pkgbuilds/$pkg ]] || continue
            echo "Building $pkg..."
            cp -r pkgbuilds/$pkg /tmp/build-$pkg
            chown -R builder /tmp/build-$pkg
            cd /tmp/build-$pkg
            sudo -u builder makepkg -s --noconfirm --noprogressbar 2>&1
            cp *.pkg.tar.zst $GITHUB_WORKSPACE/output/ 2>/dev/null || true
            cd $GITHUB_WORKSPACE
          done

      - name: Generate pacman repo database
        run: |
          cd output
          repo-add hoopoo.db.tar.gz *.pkg.tar.zst 2>/dev/null || true
          ls -la

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: output/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
