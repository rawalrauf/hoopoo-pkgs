name: Publish

on:
  push:
    branches: [main, edge]
    paths:
      - 'pkgbuilds/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of packages to build (empty = all)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup build environment
        run: |
          pacman -Sy --noconfirm base-devel git go pacman

          # Create non-root build user (makepkg refuses to run as root)
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # Allow builder to write to workspace
          chown -R builder "$GITHUB_WORKSPACE"

      - name: Determine packages to build
        id: packages
        run: |
          if [[ -n "${{ github.event.inputs.packages }}" ]]; then
            echo "pkgs=${{ github.event.inputs.packages }}" >> $GITHUB_OUTPUT
          else
            changed=$(git diff --name-only HEAD~1 HEAD | \
              grep '^pkgbuilds/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if [[ -z $changed ]]; then
              # fallback: build all on manual dispatch with no input
              changed=$(ls pkgbuilds/ | tr '\n' ' ')
            fi
            echo "pkgs=$changed" >> $GITHUB_OUTPUT
          fi

      - name: Build packages
        run: |
          mkdir -p output
          for pkg in ${{ steps.packages.outputs.pkgs }}; do
            [[ -d pkgbuilds/$pkg ]] || continue
            echo "=== Building $pkg ==="
            cp -r pkgbuilds/$pkg /tmp/build-$pkg
            chown -R builder /tmp/build-$pkg
            cd /tmp/build-$pkg
            sudo -u builder makepkg -s --noconfirm --noprogressbar --needed 2>&1 || {
              echo "FAILED: $pkg" ; cd $GITHUB_WORKSPACE ; continue
            }
            cp *.pkg.tar.zst $GITHUB_WORKSPACE/output/ 2>/dev/null || true
            cd $GITHUB_WORKSPACE
          done
          ls output/

      - name: Download existing release assets
        run: |
          mkdir -p output
          curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/release.json 2>/dev/null || true
          if [[ -f /tmp/release.json ]]; then
            grep -oP '"browser_download_url":\s*"\K[^"]+' /tmp/release.json | while read url; do
              name=$(basename "$url")
              if [[ $name == *.pkg.tar.zst || $name == hoopoo.db* || $name == hoopoo.files* ]]; then
                [[ -f output/$name ]] || curl -sL "$url" -o "output/$name"
              fi
            done
          fi

      - name: Generate pacman repo database
        run: |
          cd output
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if (( ${#pkgs[@]} > 0 )); then
            repo-add hoopoo.db.tar.gz "${pkgs[@]}"
          fi
          ls -lh

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "name=stable" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: output/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
