name: Unpublish Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated list of packages to remove (e.g. linux-ptl nvidia-580xx-dkms)'
        required: true
      channels:
        description: 'Channels to remove from (removes from database AND deletes files from R2)'
        required: true
        default: 'edge stable'
        type: choice
        options:
          - edge
          - stable
          - edge stable
      delete_pkgbuild:
        description: 'Also delete PKGBUILD directories and commit?'
        required: true
        type: boolean
        default: true

jobs:
  unpublish:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Arch container for unpublish
        run: |
          docker pull archlinux/archlinux:latest
          docker create --name unpublish-container \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux/archlinux:latest tail -f /dev/null
          docker start unpublish-container
          docker exec unpublish-container pacman -Sy --noconfirm rclone pacman

      - name: Unpublish from channels
        run: |
          for channel in ${{ inputs.channels }}; do
            echo ""
            echo "=== Processing $channel channel ==="
            docker exec \
              -e RCLONE_CONFIG_R2_TYPE=s3 \
              -e RCLONE_CONFIG_R2_PROVIDER=Cloudflare \
              -e RCLONE_CONFIG_R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
              -e RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
              -e RCLONE_CONFIG_R2_ENDPOINT="${{ secrets.R2_ENDPOINT_URL }}" \
              unpublish-container \
              bash bin/unpublish-packages.sh \
                --channel "$channel" \
                --packages "${{ inputs.packages }}"
          done

      - name: Cleanup container
        if: always()
        run: |
          docker stop unpublish-container || true
          docker rm unpublish-container || true

      - name: Delete PKGBUILD directories
        if: inputs.delete_pkgbuild == true
        run: |
          git config user.name "hoopoo-bot"
          git config user.email "bot@hoopoo"
          
          pkg_array=(${{ inputs.packages }})
          deleted=()
          
          for pkg in "${pkg_array[@]}"; do
            if [[ -d "pkgbuilds/$pkg" ]]; then
              echo "Deleting pkgbuilds/$pkg"
              rm -rf "pkgbuilds/$pkg"
              deleted+=("$pkg")
            else
              echo "Warning: pkgbuilds/$pkg not found"
            fi
          done
          
          if [[ ${#deleted[@]} -eq 0 ]]; then
            echo "No PKGBUILD directories to delete"
            exit 0
          fi
          
          # Build commit message
          if [[ ${#deleted[@]} -eq 1 ]]; then
            commit_msg="${deleted[0]} officially retired"
          elif [[ ${#deleted[@]} -eq 2 ]]; then
            commit_msg="${deleted[0]} and ${deleted[1]} officially retired"
          else
            # Three or more
            msg="${deleted[0]}"
            for ((i=1; i<${#deleted[@]}-1; i++)); do
              msg="$msg, ${deleted[$i]}"
            done
            msg="$msg and ${deleted[$((${#deleted[@]}-1))]}"
            commit_msg="$msg officially retired"
          fi
          
          git add pkgbuilds/
          git commit -m "$commit_msg"
          git push origin HEAD:refs/heads/edge
