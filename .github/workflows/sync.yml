name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed_packages: ${{ steps.sync.outputs.changed_packages }}
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch, update and commit package versions
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "hoopoo-bot"
          git config user.email "bot@hoopoo"
          python3 bin/sync-upstream.py
          if ! git diff --quiet pkgbuilds/; then
            changed=$(git diff --name-only pkgbuilds/ | cut -d/ -f2 | sort -u)
            echo "changed_packages=$(echo "$changed" | tr '\n' ' ' | xargs)" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            # Build human-friendly commit message
            pkg_array=($changed)
            pkg_count=${#pkg_array[@]}
            
            if [[ $pkg_count -eq 1 ]]; then
              commit_msg="${pkg_array[0]} updated to latest release"
            elif [[ $pkg_count -eq 2 ]]; then
              commit_msg="${pkg_array[0]} and ${pkg_array[1]} updated to latest release"
            else
              # Three or more: "pkg1, pkg2, pkg3 and pkg4 updated to latest release"
              msg="${pkg_array[0]}"
              for ((i=1; i<pkg_count-1; i++)); do
                msg="$msg, ${pkg_array[$i]}"
              done
              msg="$msg and ${pkg_array[$((pkg_count-1))]}"
              commit_msg="$msg updated to latest release"
            fi
            
            git add pkgbuilds/
            git commit -m "$commit_msg"
            git push origin HEAD:refs/heads/edge
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "All packages up to date"
          fi

  promote:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm git rclone pacman gnupg

      - uses: actions/checkout@v4
        with:
          ref: edge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import Hoopoo GPG key
        run: |
          # Import the public key for verification
          curl -sL https://pkgs.hoopoo.net/stable/x86_64/hoopoo-keyring-1.0.0-4-any.pkg.tar.zst -o /tmp/hoopoo-keyring.pkg.tar.zst
          pacman -U --noconfirm /tmp/hoopoo-keyring.pkg.tar.zst || true
          pacman-key --init
          pacman-key --populate hoopoo || true
          
          # Also import directly from keyserver as backup
          gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 070030E5D914817BA797F66AAF1C8F036A5E73FD || \
          gpg --keyserver hkps://keys.openpgp.org --recv-keys 070030E5D914817BA797F66AAF1C8F036A5E73FD || true

      - name: Copy OLD packages from edge to stable via R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          bash bin/r2-copy-packages.sh \
            --packages "${{ needs.sync.outputs.changed_packages }}" \
            --from edge \
            --to stable

  build-edge:
    needs: [sync, promote]
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish workflow for edge
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          gh workflow run publish.yml \
            --repo ${{ github.repository }} \
            --ref edge \
            --field packages="${{ needs.sync.outputs.changed_packages }}"
