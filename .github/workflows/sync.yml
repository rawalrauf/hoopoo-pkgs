name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check and update package versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "hoopoo-bot"
          git config user.email "bot@hoopoo"
          python3 bin/sync-upstream.py
          if ! git diff --quiet pkgbuilds/; then
            git add pkgbuilds/
            git commit -m "chore: sync upstream package versions"
            git push origin edge
          else
            echo "All packages up to date"
          fi
