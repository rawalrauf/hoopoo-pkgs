name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed_packages: ${{ steps.sync.outputs.changed_packages }}
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check and update package versions
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 bin/sync-upstream.py
          if ! git diff --quiet pkgbuilds/; then
            changed=$(git diff --name-only pkgbuilds/ | cut -d/ -f2 | sort -u | tr '\n' ' ' | xargs)
            echo "changed_packages=$changed" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "All packages up to date"
          fi

  promote:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4
        with:
          ref: edge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup tools
        run: pacman -S --noconfirm --needed python github-cli curl pacman

      - name: Copy current edge versions to stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 bin/pkg-utils.py \
            --packages "${{ needs.sync.outputs.changed_packages }}" \
            --from edge \
            --to stable

  commit:
    needs: [sync, promote]
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Commit updated PKGBUILDs to edge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "hoopoo-bot"
          git config user.email "bot@hoopoo"
          python3 bin/sync-upstream.py
          git add pkgbuilds/
          git commit -m "chore: sync upstream package versions"
          git push origin HEAD:refs/heads/edge
