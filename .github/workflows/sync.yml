name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed_packages: ${{ steps.sync.outputs.changed_packages }}
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch, update and commit package versions
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "hoopoo-bot"
          git config user.email "bot@hoopoo"
          python3 bin/sync-upstream.py
          if ! git diff --quiet pkgbuilds/; then
            changed=$(git diff --name-only pkgbuilds/ | cut -d/ -f2 | sort -u)
            echo "changed_packages=$(echo "$changed" | tr '\n' ' ' | xargs)" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            for pkg in $changed; do
              git add pkgbuilds/$pkg/
              git commit -m "pkg($pkg): sync upstream version"
            done
            git push origin HEAD:refs/heads/edge
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "All packages up to date"
          fi

  build-edge:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger R2 publish workflow for edge
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          gh workflow run publish-r2.yml \
            --repo ${{ github.repository }} \
            --ref edge \
            --field packages="${{ needs.sync.outputs.changed_packages }}"
  
  promote:
    needs: [sync, build-edge]
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm git rclone pacman

      - uses: actions/checkout@v4
        with:
          ref: edge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for edge build to complete
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          echo "Waiting 60s for edge build to start..."
          sleep 60
          
          # Wait for publish-r2.yml to complete
          timeout=600
          elapsed=0
          while (( elapsed < timeout )); do
            if gh run list --workflow=publish-r2.yml --branch edge --limit 1 --json status \
               | grep -q '"status":"completed"'; then
              echo "Edge build completed"
              break
            fi
            echo "Waiting for edge build... (${elapsed}s/${timeout}s)"
            sleep 10
            elapsed=$((elapsed + 10))
          done

      - name: Copy packages from edge to stable via R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          bash bin/r2-copy-packages.sh \
            --packages "${{ needs.sync.outputs.changed_packages }}" \
            --from edge \
            --to stable
