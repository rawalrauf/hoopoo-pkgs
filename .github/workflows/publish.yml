name: Publish Packages

on:
  push:
    branches: [edge, stable]
    paths:
      - 'pkgbuilds/**'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to publish to (edge or stable)'
        required: true
        default: 'edge'
        type: choice
        options:
          - edge
          - stable
      packages:
        description: 'Space-separated list of packages to build (empty = changed packages)'
        required: false

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    environment: publish
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup build environment
        run: |
          # Enable multilib
          if ! grep -q '^\[multilib\]' /etc/pacman.conf; then
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          fi
          pacman -Sy --noconfirm base-devel git gnupg curl

          useradd -m builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder "$GITHUB_WORKSPACE"

          # Import Hoopoo signing key
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye 2>/dev/null || true
          KEYGRIP=$(gpg --with-keygrip --list-secret-keys | grep Keygrip | head -1 | awk '{print $3}')
          if [[ -n $KEYGRIP ]]; then
            /usr/lib/gnupg/gpg-preset-passphrase --preset "$KEYGRIP" <<< "$GPG_PASSPHRASE" 2>/dev/null || true
          fi
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Determine channel
        id: channel
        run: |
          if [[ -n "${{ github.event.inputs.channel }}" ]]; then
            echo "name=${{ github.event.inputs.channel }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/stable" ]]; then
            echo "name=stable" >> $GITHUB_OUTPUT
          else
            echo "name=edge" >> $GITHUB_OUTPUT
          fi

      - name: Determine packages to build
        id: packages
        run: |
          if [[ -n "${{ github.event.inputs.packages }}" ]]; then
            echo "list=${{ github.event.inputs.packages }}" >> $GITHUB_OUTPUT
          else
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^pkgbuilds/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if [[ -z $changed ]]; then
              echo "No packages changed, building all"
              changed=$(ls pkgbuilds/ | tr '\n' ' ')
            fi
            echo "list=$changed" >> $GITHUB_OUTPUT
          fi

      - name: Install rclone
        run: |
          pacman -S --noconfirm unzip
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o rclone.zip
          unzip -jq rclone.zip '*/rclone'
          chmod +x rclone
          mv rclone /usr/local/bin/
          rclone version

      - name: Download existing packages from R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          CHANNEL="${{ steps.channel.outputs.name }}"
          mkdir -p repo
          echo "Downloading existing packages and database from $CHANNEL..."
          rclone copy r2:hoopoo-pkgs/$CHANNEL/x86_64/ repo/ \
            --include "*.pkg.tar.zst" --include "*.pkg.tar.zst.sig" \
            --include "hoopoo.db.tar.zst" --include "hoopoo.files.tar.zst" \
            --s3-no-check-bucket 2>/dev/null || echo "No existing packages found"
          ls -lh repo/ || true

      - name: Verify downloaded packages integrity
        run: |
          CHANNEL="${{ steps.channel.outputs.name }}"
          if [[ ! -f repo/hoopoo.db.tar.zst ]]; then
            echo "No existing database, skipping verification"
            exit 0
          fi
          
          echo "==> Extracting SHA256 checksums from database..."
          tar -xOf repo/hoopoo.db.tar.zst --wildcards '*/desc' 2>/dev/null | awk '
            $0 == "%FILENAME%" { getline; fname = $0; next }
            $0 == "%SHA256SUM%" { getline; print fname, $0 }
          ' > /tmp/db-checksums.txt
          
          echo "==> Verifying SHA256 checksums..."
          failed=0
          while read -r filename expected; do
            [[ -f repo/$filename ]] || continue
            got=$(sha256sum "repo/$filename" | awk '{print $1}')
            if [[ $got != "$expected" ]]; then
              echo "ERROR: SHA256 mismatch for $filename"
              failed=$((failed + 1))
            fi
          done < /tmp/db-checksums.txt
          
          if (( failed > 0 )); then
            echo "ERROR: $failed package(s) failed SHA256 verification"
            exit 1
          fi
          echo "✓ All downloaded packages verified"

      - name: Build packages
        run: |
          mkdir -p new-packages built-packages
          built=0
          skipped=0
          
          # When packages are explicitly specified, force rebuild them
          FORCE_BUILD="${{ github.event.inputs.packages }}"

          for pkg in ${{ steps.packages.outputs.list }}; do
            [[ -d pkgbuilds/$pkg ]] || continue

            # Get package metadata
            pkgver=$(bash -c "source pkgbuilds/$pkg/PKGBUILD 2>/dev/null && echo \${epoch:+\$epoch:}\$pkgver-\$pkgrel" 2>/dev/null)
            pkgname=$(bash -c "source pkgbuilds/$pkg/PKGBUILD 2>/dev/null && echo \$pkgname" 2>/dev/null)
            arch_arr=$(bash -c "source pkgbuilds/$pkg/PKGBUILD 2>/dev/null && echo \${arch[*]}" 2>/dev/null)

            if [[ $arch_arr == "any" ]]; then
              arch="any"
            else
              arch="x86_64"
            fi

            # Check if already exists (skip only if not explicitly requested)
            if [[ -z "$FORCE_BUILD" && -n $pkgver && -n $pkgname && -n $arch ]]; then
              encoded_ver="${pkgver//:/.}"
              encoded_ver="${encoded_ver//+/.2B}"
              expected_file="${pkgname}-${encoded_ver}-${arch}.pkg.tar.zst"
              if [[ -f repo/$expected_file ]]; then
                echo "=== Skipping $pkg ($expected_file already in repo) ==="
                cp repo/$expected_file new-packages/
                skipped=$(( skipped + 1 ))
                continue
              fi
            fi

            echo "=== Building $pkg ==="
            cp -r pkgbuilds/$pkg /tmp/build-$pkg
            chown -R builder /tmp/build-$pkg
            cd /tmp/build-$pkg
            
            sudo -u builder makepkg -s --noconfirm --noprogressbar --needed 2>&1 || {
              echo "FAILED: $pkg"
              cd $GITHUB_WORKSPACE
              continue
            }
            
            # Copy to both directories to track what was actually built
            cp *.pkg.tar.zst $GITHUB_WORKSPACE/new-packages/ 2>/dev/null || true
            cp *.pkg.tar.zst $GITHUB_WORKSPACE/built-packages/ 2>/dev/null || true
            built=$(( built + 1 ))
            cd $GITHUB_WORKSPACE
          done

          echo "Built: $built, Reused: $skipped"
          
          # Copy all existing packages that weren't already copied
          for pkg in repo/*.pkg.tar.zst; do
            [[ -f $pkg ]] || continue
            basename=$(basename "$pkg")
            [[ -f new-packages/$basename ]] || cp "$pkg" new-packages/
          done
          
          total_pkgs=$(ls new-packages/*.pkg.tar.zst 2>/dev/null | wc -l)
          echo "Total packages ready: $total_pkgs"
          
          if (( total_pkgs == 0 )); then
            echo "No packages to publish"
            echo "nothing_to_publish=true" >> $GITHUB_ENV
          fi
          ls -lh new-packages/ 2>/dev/null || true

      - name: Sign new packages
        if: env.nothing_to_publish != 'true'
        run: |
          echo "==> Signing packages..."
          signed=0
          for pkg in new-packages/*.pkg.tar.zst; do
            [[ -f $pkg ]] || continue
            # Skip if already signed
            if [[ -f $pkg.sig ]]; then
              echo "  Already signed: $(basename $pkg)"
              continue
            fi
            echo "  Signing: $(basename $pkg)"
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign "$pkg"
            signed=$((signed + 1))
          done
          echo "Signed $signed new package(s)"
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify all package signatures
        if: env.nothing_to_publish != 'true'
        run: |
          echo "==> Verifying GPG signatures..."
          failed=0
          verified=0
          
          for pkg in new-packages/*.pkg.tar.zst; do
            [[ -f $pkg ]] || continue
            sig="${pkg}.sig"
            
            if [[ ! -f $sig ]]; then
              echo "  ERROR: No signature for $(basename $pkg)"
              failed=$((failed + 1))
              continue
            fi
            
            if gpg --batch --verify "$sig" "$pkg" 2>/dev/null; then
              verified=$((verified + 1))
            else
              echo "  ERROR: Invalid signature for $(basename $pkg)"
              failed=$((failed + 1))
            fi
          done
          
          echo "Verified: $verified, Failed: $failed"
          
          if (( failed > 0 )); then
            echo "ERROR: $failed package(s) failed signature verification"
            exit 1
          fi
          echo "✓ All packages have valid signatures"

      - name: Merge with existing packages
        if: env.nothing_to_publish != 'true'
        run: |
          # Copy existing packages to new-packages (avoiding duplicates)
          for pkg in repo/*.pkg.tar.zst; do
            [[ -f $pkg ]] || continue
            basename=$(basename "$pkg")
            [[ -f new-packages/$basename ]] || cp "$pkg" new-packages/
          done

          # Generate repo database
          cd new-packages
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if (( ${#pkgs[@]} > 0 )); then
            repo-add hoopoo.db.tar.zst "${pkgs[@]}"
            ln -sf hoopoo.db.tar.zst hoopoo.db
            ln -sf hoopoo.files.tar.zst hoopoo.files
            echo "Database created with ${#pkgs[@]} packages"
          else
            echo "No packages found!"
            exit 1
          fi
          ls -lh

      - name: Upload to R2
        if: env.nothing_to_publish != 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          CHANNEL="${{ steps.channel.outputs.name }}"
          cd new-packages
          
          # Extract package base names from packages in new-packages
          echo "==> Identifying rebuilt packages..."
          declare -A rebuilt_bases
          shopt -s nullglob
          
          # Use built-packages directory to identify what was actually built
          cd "$GITHUB_WORKSPACE/built-packages"
          for pkg in *.pkg.tar.zst; do
            [[ -f "$pkg" ]] || continue
            # Extract base name by removing version-release-arch
            base="${pkg%.pkg.tar.zst}"
            base=$(echo "$base" | sed -E 's/-[0-9]+:?[0-9.]+.*-[0-9]+-[^-]+$//')
            rebuilt_bases["$base"]=1
            echo "  Will clean up old versions of: $base"
          done
          
          cd "$GITHUB_WORKSPACE/new-packages"
          
          # Delete old versions from R2 using database filenames
          if [[ ${#rebuilt_bases[@]} -gt 0 ]]; then
            echo ""
            echo "==> Downloading existing database to find old versions..."
            mkdir -p /tmp/old-db
            if rclone copy r2:hoopoo-pkgs/$CHANNEL/x86_64/ /tmp/old-db/ \
                 --include "hoopoo.db.tar.zst" \
                 --s3-no-check-bucket 2>/dev/null && [[ -f /tmp/old-db/hoopoo.db.tar.zst ]]; then
              
              echo "==> Deleting old versions from R2..."
              for base in "${!rebuilt_bases[@]}"; do
                echo "  Removing old versions of: $base"
                # Extract filenames for this base from old database
                tar -xOf /tmp/old-db/hoopoo.db.tar.zst --wildcards '*/desc' 2>/dev/null | \
                  awk -v base="$base" '
                    $0 == "%BASE%" { getline pkgbase }
                    $0 == "%FILENAME%" { getline filename }
                    pkgbase == base && filename != "" { print filename; filename="" }
                  ' | while IFS= read -r filename; do
                    [[ -n "$filename" ]] || continue
                    echo "    Deleting: $filename"
                    rclone deletefile r2:hoopoo-pkgs/$CHANNEL/x86_64/$filename --s3-no-check-bucket 2>/dev/null || true
                    rclone deletefile r2:hoopoo-pkgs/$CHANNEL/x86_64/$filename.sig --s3-no-check-bucket 2>/dev/null || true
                  done
              done
            else
              echo "  No existing database found, skipping cleanup"
            fi
          fi
          
          # Upload packages and signatures
          echo ""
          echo "==> Uploading new packages..."
          rclone copy . r2:hoopoo-pkgs/$CHANNEL/x86_64/ \
            --include "*.pkg.tar.zst" --include "*.pkg.tar.zst.sig" \
            --s3-no-check-bucket --transfers 8
          
          # Upload database files (overwrite, these change)
          echo "==> Uploading database..."
          rclone copy . r2:hoopoo-pkgs/$CHANNEL/x86_64/ \
            --include "hoopoo.db.tar.zst" --include "hoopoo.db" \
            --include "hoopoo.files.tar.zst" --include "hoopoo.files" \
            --exclude "*.old" --exclude "*.gz" \
            --copy-links --s3-no-check-bucket
          
          echo ""
          echo "✓ Published to pkgs.hoopoo.net/$CHANNEL/x86_64/"

      - name: Verify upload
        if: env.nothing_to_publish != 'true'
        run: |
          CHANNEL="${{ steps.channel.outputs.name }}"
          echo "Verifying pkgs.hoopoo.net/$CHANNEL/x86_64/hoopoo.db exists..."
          sleep 5
          curl -fsSL --retry 3 "https://pkgs.hoopoo.net/$CHANNEL/x86_64/hoopoo.db" > /dev/null && \
            echo "✓ Database is live" || \
            echo "⚠ Database not yet available (may take a moment to propagate)"
